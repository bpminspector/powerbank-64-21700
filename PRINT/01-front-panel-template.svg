<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>Шаблон центральної панелі PowerBank64 — 1:1</title>
  <desc>Панель 50 на 190 мм. Друкувати на A4 у масштабі 100 відсотків без підгонки до сторінки.</desc>
  <defs>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto-start-reverse">
      <path d="M0,0 L4,2 L0,4 z" fill="#334155"/>
    </marker>
    <style>
      .page { font-family: 'DejaVu Sans', sans-serif; fill: #172033; }
      .cut { fill: none; stroke: #d62828; stroke-width: 0.25; }
      .pocket { fill: none; stroke: #2563eb; stroke-width: 0.25; stroke-dasharray: 1.2 0.8; }
      .engrave { fill: #172033; stroke: none; }
      .dim { fill: none; stroke: #334155; stroke-width: 0.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .thin { fill: none; stroke: #64748b; stroke-width: 0.18; }
    </style>
  </defs>
  <rect width="210" height="297" fill="white"/>
  <text class="page" x="105" y="17" text-anchor="middle" font-size="5" font-weight="700">PowerBank64 • центральна панель</text>
  <text class="page" x="105" y="24" text-anchor="middle" font-size="3.1">Друк 1:1 на A4 • відключити «вписати в сторінку»</text>

  <!-- PANEL COORDINATES: x=80..130, y=48..238; physical size 50 x 190 mm -->
  <rect class="cut" x="80" y="48" width="50" height="190" rx="2.5"/>

  <!-- Four generic M3 mounting holes -->
  <circle class="cut" cx="85" cy="53" r="1.6"/><circle class="cut" cx="125" cy="53" r="1.6"/>
  <circle class="cut" cx="85" cy="233" r="1.6"/><circle class="cut" cx="125" cy="233" r="1.6"/>

  <!-- M2 holes matching the separate printed LCD retainer -->
  <circle class="cut" cx="88.5" cy="55.5" r="1.1"/><circle class="cut" cx="121.5" cy="55.5" r="1.1"/>
  <circle class="cut" cx="88.5" cy="92.5" r="1.1"/><circle class="cut" cx="121.5" cy="92.5" r="1.1"/>

  <!-- LCD active window 15.6 square; dashed board outline 21.74 x 29.24 -->
  <rect class="pocket" x="94.13" y="59.38" width="21.74" height="29.24" rx="0.5"/>
  <rect class="cut" x="97.2" y="65.7" width="15.6" height="15.6"/>

  <!-- Three shallow touch zones: engrave/recess only, do not drill -->
  <circle class="thin" cx="90" cy="106" r="4.2"/><circle class="thin" cx="105" cy="106" r="4.2"/><circle class="thin" cx="120" cy="106" r="4.2"/>
  <text class="page" x="90" y="107" text-anchor="middle" font-size="2.6">◀</text>
  <text class="page" x="105" y="107" text-anchor="middle" font-size="2.6">OK</text>
  <text class="page" x="120" y="107" text-anchor="middle" font-size="2.6">▶</text>
  <text class="page" x="105" y="117" text-anchor="middle" font-size="2.5">СЕНСОРНІ ЗОНИ • НЕ СВЕРДЛИТИ</text>

  <!-- Low-current logic toggle holes and indicator LED holes -->
  <g class="cut">
    <circle cx="97" cy="132" r="3.25"/><circle cx="119" cy="132" r="1.6"/>
    <circle cx="97" cy="151" r="3.25"/><circle cx="119" cy="151" r="1.6"/>
    <circle cx="97" cy="170" r="3.25"/><circle cx="119" cy="170" r="1.6"/>
    <circle cx="97" cy="189" r="3.25"/><circle cx="119" cy="189" r="1.6"/>
  </g>
  <g class="page" font-size="2.6">
    <text x="83" y="133">MAIN</text><text x="83" y="152">12 V</text>
    <text x="83" y="171">24 V</text><text x="83" y="190">USB</text>
    <text x="116" y="126" font-size="2.1">LED</text>
  </g>

  <!-- Adjustable generic openings for two dual-port USB modules -->
  <rect class="cut" x="91" y="204" width="28" height="8" rx="1"/>
  <rect class="cut" x="91" y="218" width="28" height="8" rx="1"/>
  <text class="page" x="105" y="209.2" text-anchor="middle" font-size="2.4">USB 1</text>
  <text class="page" x="105" y="223.2" text-anchor="middle" font-size="2.4">USB 2</text>

  <!-- Optional acoustic grille for an unselected microphone module -->
  <g class="cut">
    <circle cx="98" cy="231" r="0.65"/><circle cx="101.5" cy="231" r="0.65"/>
    <circle cx="105" cy="231" r="0.65"/><circle cx="108.5" cy="231" r="0.65"/>
    <circle cx="112" cy="231" r="0.65"/>
  </g>

  <!-- Dimensions -->
  <line class="dim" x1="80" y1="43" x2="130" y2="43"/>
  <line class="thin" x1="80" y1="45" x2="80" y2="48"/><line class="thin" x1="130" y1="45" x2="130" y2="48"/>
  <text class="page" x="105" y="41" text-anchor="middle" font-size="3">50 mm</text>
  <line class="dim" x1="137" y1="48" x2="137" y2="238"/>
  <line class="thin" x1="130" y1="48" x2="139" y2="48"/><line class="thin" x1="130" y1="238" x2="139" y2="238"/>
  <text class="page" x="143" y="143" font-size="3" transform="rotate(90 143 143)">190 mm</text>

  <!-- 20 mm print calibration square -->
  <rect class="cut" x="168" y="254" width="20" height="20"/>
  <text class="page" x="178" y="280" text-anchor="middle" font-size="2.8">Перевірка 20 мм</text>

  <text class="page" x="16" y="254" font-size="2.7" font-weight="700">Легенда:</text>
  <line class="cut" x1="16" y1="260" x2="28" y2="260"/><text class="page" x="31" y="261" font-size="2.5">виріз / отвір</text>
  <line class="pocket" x1="16" y1="266" x2="28" y2="266"/><text class="page" x="31" y="267" font-size="2.5">плата дисплея; вікно 15,6 × 15,6 мм</text>
  <text class="page" x="16" y="275" font-size="2.5">Перевірити всі отвори за реальними деталями.</text>
  <text class="page" x="16" y="280" font-size="2.5">Панель — припущення 50 × 190 × 3 мм;</text>
  <text class="page" x="16" y="285" font-size="2.5">USB-вікна та тумблери можуть потребувати правки.</text>
</svg>
