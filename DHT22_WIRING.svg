  <text x="600" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#234a75">3-pin module: VCC → 3V3, OUT → GPIO47, GND → GND. Add 4.7 kΩ only if the board has no pull-up. No diode.</text>
